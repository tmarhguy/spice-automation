[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spice-automation"
version = "0.1.0"
description = "Python pipeline for NGSpice parametric optimization and PPA reporting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tyrone Marhguy" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/tmarhguy/spice-automation"

[project.scripts]
spice-automation = "spicelab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spicelab*", "recipes*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
"recipes.sram" = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
