name: Regression

on:
  workflow_dispatch:

jobs:
  ngspice-regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NGSpice
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Write model card from secret
        env:
          MODEL_CONTENT: ${{ secrets.SPICE_MODEL_PATH }}
        run: |
          if [ -z "$MODEL_CONTENT" ]; then
            echo "Configure repository secret SPICE_MODEL_PATH with 22nm_HP.pm contents."
            exit 1
          fi
          echo "$MODEL_CONTENT" > /tmp/22nm_HP.pm
          echo "SPICE_MODEL_PATH=/tmp/22nm_HP.pm" >> "$GITHUB_ENV"

      - name: Run f_max search
        run: |
          spice-automation fmax \
            --json-out reports/sram_fmax_baseline.json \
            --verify-macro-cycles 8 \
            --format json

      - name: Run short sweep (subset)
        run: |
          spice-automation sweep \
            --grid 1.0,0.90,0.80 \
            --csv-out reports/sram_sweep_results.csv \
            --workers 1
